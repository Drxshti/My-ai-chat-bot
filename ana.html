<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stylist Ana</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Reset and Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      height: 100vh;
    }

    /* Main App Container (Mobile Size) */
    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background-color: #FDFBF7;
      color: #2D2D2D;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 40px 24px 16px;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: #333;
      cursor: pointer;
      padding: 8px;
    }

    .header-title {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-title span {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #888;
      text-transform: uppercase;
    }

    .header-title h1 {
      font-size: 20px;
      font-weight: 600;
      margin-top: 4px;
    }

    .header-title .underline {
      width: 16px;
      height: 2px;
      background-color: #CBA461;
      margin-top: 4px;
      border-radius: 2px;
    }

    /* Scrollable Content Area */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px 24px 120px; /* Extra bottom padding for input area */
    }

    /* Intro Section */
    .intro-label {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .intro-label .line {
      width: 32px;
      height: 1px;
      background-color: #CBA461;
    }

    .intro-label span {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #CBA461;
      text-transform: uppercase;
    }

    .greeting {
      font-size: 44px;
      font-weight: 300;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    .greeting span {
      font-weight: 500;
      color: #CBA461;
      font-style: italic;
    }

    .description {
      color: #6B6B6B;
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 40px;
    }

    /* Action List */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: block;
    }

    .action-list {
      display: flex;
      flex-direction: column;
    }

    .action-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid #f0f0f0;
      padding: 16px 0;
      cursor: pointer;
      text-align: left;
      transition: background-color 0.2s;
    }

    .action-btn:hover {
      background-color: rgba(0,0,0,0.02);
    }

    .action-content {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .action-content i {
      color: #CBA461;
      font-size: 18px;
      width: 24px;
      text-align: center;
    }

    .action-content span {
      font-size: 15px;
      color: #333;
      font-weight: 500;
    }

    .action-btn .fa-chevron-right {
      color: #ccc;
      font-size: 14px;
    }

    /* Bottom Input Area */
    .input-area {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 24px 20px 30px;
      background: linear-gradient(to top, #FDFBF7 80%, transparent);
    }

    .input-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .camera-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: white;
      border: 1px solid #f0f0f0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      color: #333;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .text-input-wrapper {
      flex: 1;
      position: relative;
    }

    .text-input-wrapper input {
      width: 100%;
      height: 48px;
      border-radius: 24px;
      border: 1px solid #f0f0f0;
      padding: 0 20px;
      font-size: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      outline: none;
      transition: border-color 0.2s;
    }

    .text-input-wrapper input:focus {
      border-color: #CBA461;
    }

    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #E5D7BE;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .send-btn:hover, .send-btn.active {
      background-color: #CBA461;
    }

    .disclaimer {
      text-align: center;
      font-size: 10px;
      color: #aaa;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <button class="icon-btn"><i class="fa-solid fa-chevron-left"></i></button>
      <div class="header-title">
        <span>Personal Stylist</span>
        <h1>Ana</h1>
        <div class="underline"></div>
      </div>
      <button class="icon-btn"><i class="fa-regular fa-clock"></i></button>
    </header>

    <main>
      <div class="intro-label">
        <div class="line"></div>
        <span>Introducing</span>
      </div>
      
      <h2 class="greeting">
        Hi. I'm <span>Ana.</span>
      </h2>
      
      <p class="description">
        Your private stylist. Send a photo for a fit read, or pick a starting point below and I'll take it from there.
      </p>

      <span class="section-title">Where to begin</span>
      
      <div class="action-list">
        <button class="action-btn" onclick="fillInput('Rate the outfit I\'m wearing')">
          <div class="action-content">
            <i class="fa-solid fa-camera"></i>
            <span>Rate the outfit I'm wearing</span>
          </div>
          <i class="fa-solid fa-chevron-right"></i>
        </button>

        <button class="action-btn" onclick="fillInput('Find colours that suit me')">
          <div class="action-content">
            <i class="fa-solid fa-palette"></i>
            <span>Find colours that suit me</span>
          </div>
          <i class="fa-solid fa-chevron-right"></i>
        </button>

        <button class="action-btn" onclick="fillInput('Style notes for my body type')">
          <div class="action-content">
            <i class="fa-regular fa-user"></i>
            <span>Style notes for my body type</span>
          </div>
          <i class="fa-solid fa-chevron-right"></i>
        </button>

        <button class="action-btn" onclick="fillInput('What\'s quietly trending right now?')">
          <div class="action-content">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>What's quietly trending right now?</span>
          </div>
          <i class="fa-solid fa-chevron-right"></i>
        </button>

        <button class="action-btn" onclick="fillInput('Build me a capsule wardrobe')">
          <div class="action-content">
            <i class="fa-solid fa-shirt"></i>
            <span>Build me a capsule wardrobe</span>
          </div>
          <i class="fa-solid fa-chevron-right"></i>
        </button>

        <button class="action-btn" onclick="fillInput('Style rules every closet needs')">
          <div class="action-content">
            <i class="fa-solid fa-book-open"></i>
            <span>Style rules every closet needs</span>
          </div>
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </main>

    <div class="input-area">
      <div class="input-container">
        <button class="camera-btn">
          <i class="fa-solid fa-camera"></i>
        </button>
        <div class="text-input-wrapper">
          <input type="text" id="chatInput" placeholder="Ask Ana anything..." oninput="checkInput()">
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
      <p class="disclaimer">Ana can make mistakes. Check the details that matter.</p>
    </div>
  </div>

  <script>
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    // Automatically fill the input box when a quick-action is clicked
    function fillInput(text) {
      chatInput.value = text;
      checkInput();
      chatInput.focus();
    }

    // Change button color if there is text in the input
    function checkInput() {
      if (chatInput.value.trim().length > 0) {
        sendBtn.classList.add('active');
      } else {
        sendBtn.classList.remove('active');
      }
    }

    // Handle sending the message
    function sendMessage() {
      const message = chatInput.value.trim();
      if (message) {
        alert("You asked Ana: " + message + "\n\n(This is where you would connect your backend API!)");
        chatInput.value = "";
        checkInput();
      }
    }

    // Allow sending by pressing "Enter" on the keyboard
    chatInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>

</body>
</html>
