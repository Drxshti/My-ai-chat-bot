<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stylist Chloe</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Reset and Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      height: 100vh;
    }

    /* Main App Container */
    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background-color: #FDFBF7;
      color: #2D2D2D;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 40px 24px 16px;
      background-color: #FDFBF7;
      z-index: 10;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: #333;
      cursor: pointer;
      padding: 8px;
    }

    .header-title {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-title span {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #888;
      text-transform: uppercase;
    }

    .header-title h1 {
      font-size: 20px;
      font-weight: 600;
      margin-top: 4px;
    }

    .header-title .underline {
      width: 16px;
      height: 2px;
      background-color: #CBA461;
      margin-top: 4px;
      border-radius: 2px;
    }

    /* Scrollable Content Area */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px 24px 120px;
      display: flex;
      flex-direction: column;
    }

    /* Intro Section */
    #introSection {
      transition: opacity 0.3s ease;
    }

    .intro-label {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .intro-label .line {
      width: 32px;
      height: 1px;
      background-color: #CBA461;
    }

    .intro-label span {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #CBA461;
      text-transform: uppercase;
    }

    .greeting {
      font-size: 44px;
      font-weight: 300;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    .greeting span {
      font-weight: 500;
      color: #CBA461;
      font-style: italic;
    }

    .description {
      color: #6B6B6B;
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 40px;
    }

    /* Action List */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: block;
    }

    .action-list {
      display: flex;
      flex-direction: column;
    }

    .action-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid #f0f0f0;
      padding: 16px 0;
      cursor: pointer;
      text-align: left;
    }

    .action-content {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .action-content i {
      color: #CBA461;
      font-size: 18px;
      width: 24px;
      text-align: center;
    }

    .action-content span {
      font-size: 15px;
      color: #333;
      font-weight: 500;
    }

    /* Chat Interface Styles */
    #chatHistory {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0);
