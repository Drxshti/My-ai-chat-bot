<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stylist Chloe - Brutalist</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Neo-Brutalist Reset & Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* Stark, geometric/monospace typography */
      font-family: 'Courier New', Courier, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    }

    body {
      background-color: #d4d4d4; /* Raw gray background */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    /* Main App Container */
    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: 900px;
      background-color: #F4F4F0; /* Off-white/Beige paper color */
      color: #000;
      display: flex;
      flex-direction: column;
      position: relative;
      /* Thick borders and hard offset shadow */
      border: 3px solid #000;
      box-shadow: 10px 10px 0px #000;
      overflow: hidden;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      background-color: #fff;
      border-bottom: 3px solid #000;
      z-index: 10;
    }

    .icon-btn {
      background: #fff;
      border: 2px solid #000;
      font-size: 18px;
      color: #000;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 3px 3px 0px #000;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .icon-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 0px 0px 0px #000;
    }

    .header-title {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-title span {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: #000;
      color: #fff;
      padding: 2px 6px;
      margin-bottom: 4px;
    }

    .header-title h1 {
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -1px;
    }

    /* Scrollable Content Area */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 30px 24px 140px;
      display: flex;
      flex-direction: column;
    }

    /* Intro Section */
    #introSection {
      transition: opacity 0.3s ease;
    }

    .intro-label {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .intro-label span {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #000;
      text-transform: uppercase;
      border-bottom: 2px solid #000;
    }

    .greeting {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .greeting span {
      background-color: #000;
      color: #fff;
      padding: 0 8px;
    }

    .description {
      font-weight: 600;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 40px;
      padding-left: 16px;
      border-left: 4px solid #000;
    }

    /* Action List */
    .section-title {
      font-size: 14px;
      font-weight: 900;
      color: #000;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: inline-block;
      background: #ccc;
      padding: 4px 8px;
      border: 2px solid #000;
    }

    .action-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #fff;
      border: 2px solid #000;
      padding: 16px;
      cursor: pointer;
      text-align: left;
      box-shadow: 4px 4px 0px #000;
      transition: all 0.1s;
    }

    .action-btn:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px #000;
    }

    .action-content {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .action-content i {
      color: #000;
      font-size: 20px;
      width: 24px;
      text-align: center;
    }

    .action-content span {
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
    }

    /* Chat Interface Styles */
    #chatHistory {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      max-width: 90%;
      padding: 16px;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 600;
      border: 2px solid #000;
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    .message.user {
      align-self: flex-end;
      background-color: #000;
      color: #fff;
      box-shadow: -6px 6px 0px #aaa;
    }

    .message.chloe {
      align-self: flex-start;
      background-color: #fff;
      color: #000;
      box-shadow: 6px 6px 0px #000;
    }

    /* Markdown inside Chloe's messages */
    .message.chloe p { margin-bottom: 12px; }
    .message.chloe p:last-child { margin-bottom: 0; }
    .message.chloe ul { margin-left: 20px; margin-bottom: 12px; }
    .message.chloe strong { background: #EAEAEA; padding: 0 4px; text-transform: uppercase; }

    .typing-indicator {
      align-self: flex-start;
      background: #fff;
      border: 2px solid #000;
      padding: 8px 16px;
      font-weight: 900;
      text-transform: uppercase;
      box-shadow: 4px 4px 0px #000;
      display: none;
    }

    /* Bottom Input Area */
    .input-area {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      background: #F4F4F0;
      border-top: 3px solid #000;
      z-index: 10;
    }

    .input-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .camera-btn, .send-btn {
      width: 50px;
      height: 50px;
      background-color: #fff;
      border: 2px solid #000;
      box-shadow: 4px 4px 0px #000;
      color: #000;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.1s;
    }

    .camera-btn:active, .send-btn:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px #000;
    }

    .send-btn.active {
      background-color: #000;
      color: #fff;
    }

    .text-input-wrapper {
      flex: 1;
    }

    .text-input-wrapper input {
      width: 100%;
      height: 50px;
      background: #fff;
      border: 2px solid #000;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: inset 3px 3px 0px #eaeaea;
      outline: none;
    }

    .text-input-wrapper input:focus {
      background: #fffdf0; /* slight yellow tint on focus */
    }

    .disclaimer {
      text-align: center;
      font-size: 10px;
      font-weight: 900;
      color: #555;
      margin-top: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <button class="icon-btn"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="header-title">
        <span>V 2.0</span>
        <h1>Chloe</h1>
      </div>
      <button class="icon-btn" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i></button>
    </header>

    <main id="mainContainer">
      <div id="introSection">
        <div class="intro-label">
          <span>Sys. Online</span>
        </div>
        
        <h2 class="greeting">
          Hi. I'm<br><span>Chloe.</span>
        </h2>
        
        <p class="description">
          Your brutalist pocket stylist. Upload a fit, or pick a starting sequence below.
        </p>

        <span class="section-title">Init Sequence //</span>
        
        <div class="action-list">
          <button class="action-btn" onclick="fillInput('What colors suit me best?')">
            <div class="action-content">
              <i class="fa-solid fa-droplet"></i>
              <span>Find my palette</span>
            </div>
            <i class="fa-solid fa-arrow-right"></i>
          </button>

          <button class="action-btn" onclick="fillInput('What is quietly trending right now?')">
            <div class="action-content">
              <i class="fa-solid fa-eye"></i>
              <span>Current Trends</span>
            </div>
            <i class="fa-solid fa-arrow-right"></i>
          </button>

          <button class="action-btn" onclick="fillInput('Build me a 5-piece capsule wardrobe')">
            <div class="action-content">
              <i class="fa-solid fa-layer-group"></i>
              <span>Capsule Wardrobe</span>
            </div>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>

      <div id="chatHistory"></div>
      <div id="typingIndicator" class="typing-indicator">Processing...</div>
    </main>

    <div class="input-area">
      <div class="input-container">
        <button class="camera-btn" onclick="alert('System awaiting image upload logic.')">
          <i class="fa-solid fa-camera"></i>
        </button>
        <div class="text-input-wrapper">
          <input type="text" id="chatInput" placeholder="ENTER COMMAND..." oninput="checkInput()">
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
      <p class="disclaimer">Outputs are AI-generated. Verify details.</p>
    </div>
  </div>

  <script>
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const introSection = document.getElementById('introSection');
    const chatHistory = document.getElementById('chatHistory');
    const typingIndicator = document.getElementById('typingIndicator');
    const mainContainer = document.getElementById('mainContainer');

    function fillInput(text) {
      chatInput.value = text;
      checkInput();
      sendMessage();
    }

    function checkInput() {
      if (chatInput.value.trim().length > 0) {
        sendBtn.classList.add('active');
      } else {
        sendBtn.classList.remove('active');
      }
    }

    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      
      if (sender === 'chloe') {
        msgDiv.innerHTML = marked.parse(text);
      } else {
        msgDiv.textContent = text;
      }
      
      chatHistory.appendChild(msgDiv);
      scrollToBottom();
    }

    function scrollToBottom() {
      mainContainer.scrollTop = mainContainer.scrollHeight;
    }

    async function sendMessage() {
      const message = chatInput.value.trim();
      if (!message) return;

      if (introSection.style.display !== 'none') {
        introSection.style.display = 'none';
      }

      appendMessage('user', message);
      chatInput.value = "";
      checkInput();

      typingIndicator.style.display = 'block';
      scrollToBottom();

      try {
        const response = await fetch('http://localhost:3000/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message })
        });

        const data = await response.json();
        
        typingIndicator.style.display = 'none';
        appendMessage('chloe', data.reply);

      } catch (error) {
        typingIndicator.style.display = 'none';
        appendMessage('chloe', "CONNECTION ERROR. RETRY INITIATED.");
      }
    }

    chatInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>
</body>
</html>
