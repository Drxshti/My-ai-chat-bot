<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stylist Chloe - Coquette</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts for the soft, elegant aesthetic -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Pacifico&display=swap" rel="stylesheet">
  <!-- Markdown parser to format Chloe's responses -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Soft Coquette Reset & Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
    }

    body {
      /* Soft pink to lavender gradient background */
      background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 10px;
    }

    /* Main App Container */
    .app-container {
      width: 100%;
      max-width: 400px;
      height: 100%;
      max-height: 850px;
      background-color: #fffafb; /* Very soft pink-white */
      color: #5c4068; /* Deep muted purple for text */
      display: flex;
      flex-direction: column;
      position: relative;
      border-radius: 40px;
      box-shadow: 0 15px 35px rgba(162, 103, 172, 0.2);
      overflow: hidden;
      border: 4px solid #fff;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 24px 15px;
      background: rgba(255, 250, 251, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 2px dashed #f1cdd7;
      z-index: 10;
    }

    .icon-btn {
      background: #fff;
      border: 2px solid #f1cdd7;
      border-radius: 50%;
      font-size: 16px;
      color: #a267ac; /* Purple */
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(241, 205, 215, 0.5);
      transition: all 0.2s;
    }

    .icon-btn:hover {
      transform: scale(1.05);
      background: #fdf2f5;
    }

    .header-title {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-title span {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ff8eaf; /* Pink */
      margin-bottom: -5px;
    }

    .header-title h1 {
      font-family: 'Pacifico', cursive;
      font-size: 28px;
      font-weight: 400;
      color: #a267ac;
      text-shadow: 1px 1px 0px #fff;
    }

    /* Scrollable Content Area */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 30px 24px 140px;
      display: flex;
      flex-direction: column;
    }

    /* Intro Section */
    #introSection {
      transition: opacity 0.3s ease;
      text-align: center;
    }

    .bow-icon {
      font-size: 32px;
      margin-bottom: 10px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .greeting {
      font-family: 'Pacifico', cursive;
      font-size: 42px;
      color: #a267ac;
      line-height: 1.2;
      margin-bottom: 15px;
    }

    .description {
      font-weight: 600;
      font-size: 15px;
      line-height: 1.5;
      color: #8c6b93;
      margin-bottom: 30px;
      padding: 0 10px;
    }

    /* Action List */
    .section-title {
      font-size: 13px;
      font-weight: 800;
      color: #ff8eaf;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
      display: inline-block;
      position: relative;
    }

    .section-title::after, .section-title::before {
      content: '🎀';
      font-size: 10px;
      margin: 0 5px;
    }

    .action-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #fff;
      border: 2px solid #f9e1e8;
      border-radius: 20px;
      padding: 16px 20px;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 4px 12px rgba(249, 225, 232, 0.5);
      transition: all 0.2s;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      border-color: #ff8eaf;
      box-shadow: 0 6px 15px rgba(255, 142, 175, 0.2);
    }

    .action-content {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .action-content i {
      color: #ff8eaf;
      font-size: 20px;
      width: 24px;
      text-align: center;
    }

    .action-content span {
      font-size: 14px;
      font-weight: 800;
      color: #5c4068;
    }

    .action-btn .fa-chevron-right {
      color: #e5b2c6;
    }

    /* Chat Interface Styles */
    #chatHistory {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 85%;
      padding: 14px 18px;
      font-size: 15px;
      line-height: 1.5;
      font-weight: 600;
      border-radius: 24px;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.8) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #c490e4, #a267ac);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 10px rgba(162, 103, 172, 0.3);
    }

    .message.chloe {
      align-self: flex-start;
      background: #fff;
      color: #5c4068;
      border: 2px solid #f9e1e8;
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 10px rgba(249, 225, 232, 0.5);
    }

    /* Markdown inside Chloe's messages */
    .message.chloe p { margin-bottom: 10px; }
    .message.chloe p:last-child { margin-bottom: 0; }
    .message.chloe ul { margin-left: 20px; margin-bottom: 10px; }
    .message.chloe strong { color: #a267ac; font-weight: 800; }

    .typing-indicator {
      align-self: flex-start;
      background: #fff;
      border: 2px solid #f9e1e8;
      border-radius: 20px;
      padding: 8px 16px;
      font-weight: 600;
      color: #ff8eaf;
      font-size: 13px;
      box-shadow: 0 4px 10px rgba(249, 225, 232, 0.5);
      display: none;
    }

    .typing-indicator i {
      animation: bounce 1s infinite;
      margin-left: 5px;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    /* Bottom Input Area */
    .input-area {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 15px 20px 25px;
      background: linear-gradient(to top, #fffafb 80%, transparent);
      z-index: 10;
    }

    .input-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      padding: 8px;
      border-radius: 30px;
      border: 2px solid #f1cdd7;
      box-shadow: 0 6px 15px rgba(241, 205, 215, 0.4);
    }

    .camera-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #fdf2f5;
      border: none;
      color: #ff8eaf;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s;
    }

    .camera-btn:hover {
      background-color: #ff8eaf;
      color: #fff;
    }

    .text-input-wrapper {
      flex: 1;
    }

    .text-input-wrapper input {
      width: 100%;
      height: 40px;
      background: transparent;
      border: none;
      padding: 0 10px;
      font-size: 15px;
      font-weight: 600;
      color: #5c4068;
      outline: none;
    }

    .text-input-wrapper input::placeholder {
      color: #d1b8c8;
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #e5b2c6;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s;
    }

    .send-btn.active {
      background-color: #a267ac;
      box-shadow: 0 4px 10px rgba(162, 103, 172, 0.4);
    }

    .disclaimer {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #bfa5c8;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <button class="icon-btn"><i class="fa-solid fa-chevron-left"></i></button>
      <div class="header-title">
        <span>Stylist</span>
        <h1>Chloe 🎀</h1>
      </div>
      <button class="icon-btn" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i></button>
    </header>

    <main id="mainContainer">
      <!-- Intro Section -->
      <div id="introSection">
        <div class="bow-icon">🎀</div>
        
        <h2 class="greeting">
          Hi sweetie!<br>I'm Chloe.
        </h2>
        
        <p class="description">
          Your personal pocket stylist. Upload an outfit to get a fit check, or pick a starting point below! ✨
        </p>

        <span class="section-title">Where to begin</span>
        
        <div class="action-list">
          <button class="action-btn" onclick="fillInput('What colors suit me best?')">
            <div class="action-content">
              <i class="fa-solid fa-palette"></i>
              <span>Find my perfect palette</span>
            </div>
            <i class="fa-solid fa-chevron-right"></i>
          </button>

          <button class="action-btn" onclick="fillInput('What is trending right now?')">
            <div class="action-content">
              <i class="fa-solid fa-wand-magic-sparkles"></i>
              <span>Show me the trends</span>
            </div>
            <i class="fa-solid fa-chevron-right"></i>
          </button>

          <button class="action-btn" onclick="fillInput('Build me a cute capsule wardrobe')">
            <div class="action-content">
              <i class="fa-solid fa-shirt"></i>
              <span>Build a capsule wardrobe</span>
            </div>
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </div>

      <!-- Chat History -->
      <div id="chatHistory"></div>
      <div id="typingIndicator" class="typing-indicator">Chloe is typing <i class="fa-solid fa-heart"></i></div>
    </main>

    <div class="input-area">
      <div class="input-container">
        <button class="camera-btn" onclick="alert('Camera integration requires file-upload logic to be added!')">
          <i class="fa-solid fa-camera"></i>
        </button>
        <div class="text-input-wrapper">
          <input type="text" id="chatInput" placeholder="Ask Chloe anything..." oninput="checkInput()">
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
      <p class="disclaimer">Chloe is an AI and can make mistakes 🎀</p>
    </div>
  </div>

  <script>
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const introSection = document.getElementById('introSection');
    const chatHistory = document.getElementById('chatHistory');
    const typingIndicator = document.getElementById('typingIndicator');
    const mainContainer = document.getElementById('mainContainer');

    function fillInput(text) {
      chatInput.value = text;
      checkInput();
      sendMessage();
    }

    function checkInput() {
      if (chatInput.value.trim().length > 0) {
        sendBtn.classList.add('active');
      } else {
        sendBtn.classList.remove('active');
      }
    }

    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      
      if (sender === 'chloe') {
        msgDiv.innerHTML = marked.parse(text);
      } else {
        msgDiv.textContent = text;
      }
      
      chatHistory.appendChild(msgDiv);
      scrollToBottom();
    }

    function scrollToBottom() {
      mainContainer.scrollTop = mainContainer.scrollHeight;
    }

    async function sendMessage() {
      const message = chatInput.value.trim();
      if (!message) return;

      if (introSection.style.display !== 'none') {
        introSection.style.display = 'none';
      }

      appendMessage('user', message);
      chatInput.value = "";
      checkInput();

      typingIndicator.style.display = 'inline-block';
      scrollToBottom();

      try {
        const response = await fetch('http://localhost:3000/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message })
        });

        const data = await response.json();
        
        typingIndicator.style.display = 'none';
        appendMessage('chloe', data.reply);

      } catch (error) {
        typingIndicator.style.display = 'none';
        appendMessage('chloe', "Oops! I lost my connection for a second. Let's try that again 🎀");
      }
    }

    chatInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>
</body>
</html>
